<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
         padding: 8px 0; border-bottom: 1px solid #ddd; }
    li span { word-break: break-word; }
    #empty { color: #888; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="form">
    <input id="input" type="text" placeholder="Add a task" autocomplete="off" aria-label="New task">
    <button type="submit">Add</button>
  </form>
  <p id="empty">No tasks yet</p>
  <ul id="list"></ul>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    let tasks = [];
    let nextId = 1;

    function render() {
      list.innerHTML = '';
      for (const task of tasks) {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = task.text; // textContent avoids HTML injection
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete ' + task.text);
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          render();
        });
        li.append(span, del);
        list.appendChild(li);
      }
      empty.hidden = tasks.length > 0;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return; // ignore empty / whitespace-only tasks
      tasks.push({ id: nextId++, text });
      input.value = '';
      input.focus();
      render();
    });

    render();
  </script>
</body>
</html>
