<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #888; --line: #ddd; --field: #fff; --btn: #eee; }
    body.dark { --bg: #121212; --fg: #eee; --muted: #999; --line: #333; --field: #1e1e1e; --btn: #2a2a2a; }
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px;
           background: var(--bg); color: var(--fg); }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; }
    input, button { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
    button { background: var(--btn); }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 12px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
         padding: 8px 0; border-bottom: 1px solid var(--line); }
    li span { word-break: break-word; }
    #empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Todo</h1>
    <button id="theme" type="button" aria-pressed="false">🌙 Dark</button>
  </header>
  <form id="form">
    <input id="input" type="text" placeholder="Add a task" autocomplete="off" aria-label="New task">
    <button type="submit">Add</button>
  </form>
  <p id="empty">No tasks yet</p>
  <ul id="list"></ul>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    let tasks = [];
    let nextId = 1;

    function render() {
      list.innerHTML = '';
      for (const task of tasks) {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = task.text; // textContent avoids HTML injection
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete ' + task.text);
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          render();
        });
        li.append(span, del);
        list.appendChild(li);
      }
      empty.hidden = tasks.length > 0;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return; // ignore empty / whitespace-only tasks
      tasks.push({ id: nextId++, text });
      input.value = '';
      input.focus();
      render();
    });

    // Dark mode: saved choice wins, otherwise follow the system setting.
    const themeBtn = document.getElementById('theme');
    function setDark(on) {
      document.body.classList.toggle('dark', on);
      themeBtn.textContent = on ? '☀️ Light' : '🌙 Dark';
      themeBtn.setAttribute('aria-pressed', String(on));
    }
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    setDark(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeBtn.addEventListener('click', () => {
      const on = !document.body.classList.contains('dark');
      setDark(on);
      try { localStorage.setItem('theme', on ? 'dark' : 'light'); } catch (e) {}
    });

    render();
  </script>
</body>
</html>
